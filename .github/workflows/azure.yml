name: Test and deploy to Azure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: '1.13.5'
  TF_IN_AUTOMATION: 'true'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Test Streamlit and the LangGraph research loop
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m unittest discover -s tests -v

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive infra
          for stack in foundation app; do
            terraform -chdir="infra/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$stack" validate
          done

      - name: Build and smoke-test the Docker image
        run: |
          docker build --pull --tag research-brief:local .
          container=$(docker run --detach --publish 127.0.0.1::8501 research-brief:local)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          binding=$(docker port "$container" 8501/tcp)
          scripts/smoke.sh "http://$binding"
          docker exec "$container" python -c '
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("/app/app.py").run()
          assert not app.exception
          assert app.title[0].value == "Research Brief Generator"
          '

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: research-brief

      - name: Smoke-test the same image in Kubernetes
        run: |
          kind load docker-image research-brief:local --name research-brief
          kubectl apply -f deploy/kubernetes/app.yaml
          kubectl rollout status deployment/research-brief --timeout=180s
          kubectl port-forward service/research-brief 8501:8501 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          scripts/smoke.sh http://127.0.0.1:8501

      - name: Prepare tested image for Azure
        if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
        run: docker save research-brief:local | gzip -1 >"$RUNNER_TEMP/research-brief.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
        with:
          name: tested-container
          path: ${{ runner.temp }}/research-brief.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: azure-container-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATE_ACCOUNT: ${{ vars.AZURE_STATE_ACCOUNT }}
    steps:
      - name: Check that this commit is still on main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$GITHUB_SHA" == "$head_sha" ]]; then
            echo 'current=true' >>"$GITHUB_OUTPUT"
          else
            echo 'This commit has been superseded on main.'
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.main.outputs.current == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.main.outputs.current == 'true'
        with:
          name: tested-container
          path: ${{ runner.temp }}

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: steps.main.outputs.current == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.main.outputs.current == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Provision Azure foundation
        if: steps.main.outputs.current == 'true'
        run: |
          terraform -chdir=infra/foundation init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=$AZURE_STATE_ACCOUNT"
          terraform -chdir=infra/foundation plan -input=false -lock-timeout=5m -out=foundation.tfplan
          terraform -chdir=infra/foundation apply -input=false -lock-timeout=5m foundation.tfplan

      - name: Publish the tested image to Azure Container Registry
        if: steps.main.outputs.current == 'true'
        id: publish
        run: |
          registry=$(terraform -chdir=infra/foundation output -raw registry_name)
          server=$(terraform -chdir=infra/foundation output -raw registry_server)
          az acr config authentication-as-arm update --registry "$registry" --status enabled --output none
          az acr login --name "$registry"
          docker load --input "$RUNNER_TEMP/research-brief.tar.gz"
          image="$server/research-brief"
          tagged_image="$image:$GITHUB_SHA"
          docker tag research-brief:local "$tagged_image"
          docker push "$tagged_image"
          image_ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tagged_image" |
            awk -v repository="$image" 'index($0, repository "@sha256:") == 1 { print; exit }')
          test -n "$image_ref"
          printf 'image=%s\n' "$image_ref" >>"$GITHUB_OUTPUT"

      - name: Deploy Azure Container App and verify HTTPS
        if: steps.main.outputs.current == 'true'
        env:
          TF_VAR_image: ${{ steps.publish.outputs.image }}
        run: |
          export TF_VAR_registry_server
          TF_VAR_registry_server=$(terraform -chdir=infra/foundation output -raw registry_server)
          export TF_VAR_environment_id
          TF_VAR_environment_id=$(terraform -chdir=infra/foundation output -raw environment_id)
          export TF_VAR_pull_identity_id
          TF_VAR_pull_identity_id=$(terraform -chdir=infra/foundation output -raw pull_identity_id)
          terraform -chdir=infra/app init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=$AZURE_STATE_ACCOUNT"
          terraform -chdir=infra/app plan -input=false -lock-timeout=5m -out=app.tfplan
          terraform -chdir=infra/app apply -input=false -lock-timeout=5m app.tfplan
          app_url=$(terraform -chdir=infra/app output -raw url)
          scripts/smoke.sh "$app_url" 60
          printf '[Open the Azure app](%s)\n' "$app_url" >>"$GITHUB_STEP_SUMMARY"
